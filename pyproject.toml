[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentdl"
version = "1.0.0"
description = "Egyszerű, egy-torrentes letöltő libtorrent alapon (háttérben futó démonnal)"
readme = "README.md"
# A felso hatart a libtorrent szabja meg: kesz csomag 3.13-ig van hozza.
requires-python = ">=3.10,<3.14"
dependencies = ["libtorrent>=2.0"]

[project.scripts]
torrentdl = "torrentdl.cli:main"

[project.gui-scripts]
torrentdl-gui = "torrentdl.gui:main"

[tool.setuptools]
packages = ["torrentdl"]

[tool.mypy]
python_version = "3.10"
# A libtorrent újabb kiadásai már hoznak típusleírást (librt csomag), ezért a
# mypy valóban ellenőrzi a libtorrent-hívásokat. Ez a beállítás azért marad,
# hogy leírás nélküli (régebbi) telepítésen se álljon meg az ellenőrzés.
ignore_missing_imports = true
warn_unused_ignores = true
# A démon állapotát (job, handle) minden belépési pont ellenőrzi futásidőben,
# de ezt a mypy nem tudja metódushatárokon átvinni; a maradék jelzés zaj lenne.
disable_error_code = ["union-attr", "index"]

[[tool.mypy.overrides]]
module = "indit"
ignore_errors = true                   # szándékosan régi nyelvtanú indító
